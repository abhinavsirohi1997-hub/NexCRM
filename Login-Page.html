<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NexCRM | Login Desk</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');

:root{
  --font:"Manrope","Segoe UI",system-ui,-apple-system,BlinkMacSystemFont,Arial,sans-serif;
  --bg:#f6f8fc;
  --card:#ffffff;
  --text:#0f172a;
  --muted:#64748b;
  --line:#e2e8f0;
  --blue:#5f7cff;
  --purple:#7657e8;
  --green:#19b76b;
  --red:#ef4444;
  --shadow:0 24px 70px rgba(15,23,42,.12);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:var(--font);
}

body{
  min-height:100vh;
  color:var(--text);
  background:
    radial-gradient(circle at top right,rgba(118,87,232,.16),transparent 28%),
    radial-gradient(circle at top left,rgba(95,124,255,.12),transparent 24%),
    linear-gradient(180deg,#ffffff 0%,#f6f8fc 100%);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}

svg{
  display:block;
}

button{
  font:inherit;
  cursor:pointer;
}

.login-desk{
  width:min(1120px,100%);
  min-height:660px;
  border:1px solid var(--line);
  border-radius:34px;
  background:rgba(255,255,255,.84);
  backdrop-filter:blur(22px);
  box-shadow:var(--shadow);
  overflow:hidden;
  display:grid;
  grid-template-columns:.88fr 1.12fr;
}

/* LEFT LOGIN */

.login-panel{
  padding:26px;
  background:rgba(255,255,255,.78);
  border-right:1px solid var(--line);
}

.top-row{
  min-height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  margin-bottom:24px;
}

.brand{
  display:flex;
  align-items:center;
  gap:13px;
}

.brand-icon{
  width:52px;
  height:52px;
  border-radius:18px;
  display:grid;
  place-items:center;
  color:#ffffff;
  background:linear-gradient(145deg,var(--blue),var(--purple));
  box-shadow:0 18px 36px rgba(95,124,255,.28);
}

.brand-icon svg{
  width:26px;
  height:26px;
}

.brand h1{
  font-size:22px;
  line-height:1;
  font-weight:800;
  letter-spacing:-.035em;
}

.brand p{
  margin-top:6px;
  color:var(--muted);
  font-size:12px;
  font-weight:700;
}

.theme-toggle{
  min-height:42px;
  border:2px solid #111827;
  border-radius:999px;
  padding:0 14px;
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:#ffffff;
  color:#0f172a;
  font-size:13px;
  font-weight:800;
  box-shadow:0 14px 30px rgba(15,23,42,.06);
  transition:.22s ease;
}

.theme-toggle svg{
  width:17px;
  height:17px;
}

.theme-toggle:hover{
  transform:translateY(-2px);
  border-color:#c7d2fe;
  box-shadow:0 18px 38px rgba(95,124,255,.13);
}

.badge{
  min-height:32px;
  display:inline-flex;
  align-items:center;
  border:1px solid #c7d2fe;
  border-radius:999px;
  background:#eef2ff;
  color:#3150d4;
  padding:0 11px;
  font-size:11px;
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;
  margin-bottom:16px;
}

.title{
  font-size:46px;
  line-height:.98;
  letter-spacing:-.075em;
  font-weight:800;
  margin-bottom:12px;
}

.subtitle{
  color:#475569;
  font-size:14px;
  line-height:1.7;
  font-weight:600;
  margin-bottom:20px;
}

.role-switch{
  min-height:58px;
  padding:5px;
  border:1px solid var(--line);
  border-radius:22px;
  background:#ffffff;
  box-shadow:0 14px 30px rgba(15,23,42,.05);
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  margin-bottom:18px;
}

.role-btn{
  border:0;
  border-radius:18px;
  background:transparent;
  color:#64748b;
  font-size:14px;
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  transition:.22s ease;
}

.role-btn svg{
  width:18px;
  height:18px;
}

.role-btn.active{
  color:#ffffff;
  background:linear-gradient(145deg,var(--blue),var(--purple));
  box-shadow:0 16px 30px rgba(95,124,255,.24);
}

.form{
  display:grid;
  gap:13px;
}

.field label{
  display:block;
  margin-bottom:7px;
  color:#334155;
  font-size:12px;
  font-weight:800;
}

.input-box{
  position:relative;
}

.input-box svg{
  position:absolute;
  left:15px;
  top:50%;
  transform:translateY(-50%);
  width:18px;
  height:18px;
  color:#64748b;
}

.input-box input{
  width:100%;
  min-height:52px;
  border:1px solid var(--line);
  border-radius:18px;
  background:#ffffff;
  outline:none;
  padding:0 44px 0 45px;
  color:#0f172a;
  font-size:14px;
  font-weight:700;
  box-shadow:0 10px 24px rgba(15,23,42,.035);
}

.input-box input:focus{
  border-color:#a5b4fc;
  box-shadow:0 0 0 4px rgba(95,124,255,.12);
}

.eye-btn{
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  width:34px;
  height:34px;
  border:0;
  border-radius:12px;
  background:transparent;
  color:#64748b;
  display:grid;
  place-items:center;
}

.eye-btn svg{
  position:static;
  transform:none;
  width:18px;
  height:18px;
}

.options{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin:3px 0;
}

.remember{
  display:flex;
  align-items:center;
  gap:8px;
  color:#64748b;
  font-size:12px;
  font-weight:800;
}

.remember input{
  width:16px;
  height:16px;
  accent-color:var(--blue);
}

.forgot{
  color:#3150d4;
  font-size:12px;
  font-weight:800;
  text-decoration:none;
}

.login-btn{
  min-height:54px;
  border:0;
  border-radius:999px;
  color:#ffffff;
  background:linear-gradient(145deg,var(--blue),var(--purple));
  box-shadow:0 22px 44px rgba(95,124,255,.25);
  font-size:15px;
  font-weight:800;
  transition:.22s ease;
}

.login-btn:hover{
  transform:translateY(-2px);
}

.message{
  min-height:18px;
  color:var(--red);
  font-size:12px;
  font-weight:800;
}

.support{
  margin-top:8px;
  text-align:center;
  color:#64748b;
  font-size:12px;
  font-weight:700;
}

.support a{
  color:#3150d4;
  text-decoration:none;
  font-weight:800;
}

/* RIGHT VISUAL */

.visual-panel{
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at top right,rgba(95,124,255,.18),transparent 34%),
    linear-gradient(145deg,rgba(255,255,255,.92),rgba(255,255,255,.72));
  display:flex;
  align-items:center;
  justify-content:center;
  padding:34px;
}

.visual-panel::after{
  content:"";
  position:absolute;
  width:340px;
  height:340px;
  border-radius:50%;
  right:-145px;
  top:-145px;
  background:rgba(118,87,232,.13);
}

.visual-panel::before{
  content:"";
  position:absolute;
  width:270px;
  height:270px;
  border-radius:50%;
  left:-110px;
  bottom:-120px;
  background:rgba(95,124,255,.11);
}

.illustration-card{
  width:100%;
  min-height:560px;
  border:1px solid rgba(95,124,255,.16);
  border-radius:32px;
  background:rgba(255,255,255,.42);
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  z-index:1;
  overflow:hidden;
}

.illustration-card::after{
  content:"";
  position:absolute;
  width:120px;
  height:120px;
  right:28px;
  bottom:28px;
  background-image:radial-gradient(var(--blue) 1.5px,transparent 1.5px);
  background-size:18px 18px;
  opacity:.35;
}

.crm-svg{
  width:82%;
  max-width:610px;
  position:relative;
  z-index:2;
  filter:drop-shadow(0 24px 36px rgba(95,124,255,.16));
}

.visual-caption{
  position:absolute;
  left:28px;
  top:28px;
  z-index:3;
  display:flex;
  align-items:center;
  gap:10px;
  border:1px solid var(--line);
  border-radius:999px;
  background:#ffffff;
  padding:8px 12px;
  box-shadow:0 14px 30px rgba(15,23,42,.06);
  color:#0f172a;
  font-size:12px;
  font-weight:800;
}

.visual-caption span{
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 0 5px rgba(25,183,107,.14);
}

/* DARK */

body.dark{
  --bg:#0b0d12;
  --card:#11141b;
  --text:#f8fafc;
  --muted:#94a3b8;
  --line:rgba(255,255,255,.10);
  background:
    radial-gradient(circle at top right,rgba(118,87,232,.18),transparent 28%),
    radial-gradient(circle at top left,rgba(95,124,255,.12),transparent 24%),
    linear-gradient(180deg,#090b10 0%,#0b0d12 100%);
}

body.dark .login-desk,
body.dark .login-panel,
body.dark .visual-panel,
body.dark .illustration-card,
body.dark .role-switch,
body.dark .input-box input,
body.dark .theme-toggle,
body.dark .visual-caption{
  background:#11141b;
  color:#f8fafc;
}

body.dark .brand p,
body.dark .subtitle,
body.dark .remember,
body.dark .support,
body.dark .field label{
  color:#94a3b8;
}

body.dark .input-box input{
  border-color:rgba(255,255,255,.12);
}

body.dark .theme-toggle{
  border-color:rgba(255,255,255,.16);
}

body.dark .visual-panel{
  background:
    radial-gradient(circle at top right,rgba(95,124,255,.14),transparent 34%),
    linear-gradient(145deg,#11141b,#0f1218);
}

/* RESPONSIVE */

@media(max-width:960px){
  .login-desk{
    grid-template-columns:1fr;
  }

  .login-panel{
    border-right:0;
    border-bottom:1px solid var(--line);
  }

  .illustration-card{
    min-height:420px;
  }
}

@media(max-width:560px){
  body{
    padding:14px;
  }

  .login-panel{
    padding:18px;
  }

  .top-row{
    align-items:flex-start;
    flex-direction:column;
  }

  .theme-toggle{
    width:100%;
    justify-content:center;
  }

  .title{
    font-size:38px;
  }

  .options{
    align-items:flex-start;
    flex-direction:column;
  }

  .visual-panel{
    padding:18px;
  }
}
</style>
</head>

<body>

<svg width="0" height="0" style="position:absolute">
  <symbol id="i-bank" viewBox="0 0 24 24">
    <path d="M3 10.5 12 5l9 5.5M5 10.5h14M6.5 10.5V18M10.2 10.5V18M13.8 10.5V18M17.5 10.5V18M4.5 18h15M3.5 21h17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <symbol id="i-user" viewBox="0 0 24 24">
    <path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM5 21c0-3.8 3.1-7 7-7s7 3.2 7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  </symbol>

  <symbol id="i-lock" viewBox="0 0 24 24">
    <path d="M7 11V8a5 5 0 0 1 10 0v3M6 11h12v10H6V11Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
  </symbol>

  <symbol id="i-eye" viewBox="0 0 24 24">
    <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z" fill="none" stroke="currentColor" stroke-width="1.8"/>
    <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" fill="none" stroke="currentColor" stroke-width="1.8"/>
  </symbol>

  <symbol id="i-shield" viewBox="0 0 24 24">
    <path d="M12 3 20 6v6c0 5-3.4 8.2-8 9-4.6-.8-8-4-8-9V6l8-3Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
  </symbol>

  <symbol id="i-moon" viewBox="0 0 24 24">
    <path d="M20 15.3A8.2 8.2 0 0 1 8.7 4 8.8 8.8 0 1 0 20 15.3Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
  </symbol>
</svg>

<div class="login-desk">

  <section class="login-panel">

    <div class="top-row">
      <div class="brand">
        <div class="brand-icon">
          <svg><use href="#i-bank"></use></svg>
        </div>
        <div>
          <h1>NexCRM Login</h1>
          <p>Premium CRM Workspace</p>
        </div>
      </div>

      <button class="theme-toggle" onclick="toggleTheme()">
        <svg><use href="#i-moon"></use></svg>
        Theme
      </button>
    </div>

    <span class="badge">Secure Access</span>

    <h2 class="title" id="loginTitle">Employee Login</h2>

    <p class="subtitle" id="loginSubtitle">
      Login to your calling dashboard and manage customers, leads, follow-ups and daily activity.
    </p>

    <div class="role-switch">
      <button type="button" class="role-btn active" onclick="setRole('employee', this)">
        <svg><use href="#i-user"></use></svg>
        Employee
      </button>

      <button type="button" class="role-btn" onclick="setRole('admin', this)">
        <svg><use href="#i-shield"></use></svg>
        Admin
      </button>
    </div>

    <form class="form" id="loginForm">

      <div class="field">
        <label>Email or Username</label>
        <div class="input-box">
          <svg><use href="#i-user"></use></svg>
          <input type="text" id="username" placeholder="Enter username">
        </div>
      </div>

      <div class="field">
        <label>Password</label>
        <div class="input-box">
          <svg><use href="#i-lock"></use></svg>
          <input type="password" id="password" placeholder="Enter password">

          <button type="button" class="eye-btn" onclick="togglePassword()">
            <svg><use href="#i-eye"></use></svg>
          </button>
        </div>
      </div>

      <div class="options">
        <label class="remember">
          <input type="checkbox" checked>
          Remember me
        </label>

        <a href="#" class="forgot">Forgot password?</a>
      </div>

      <button type="submit" class="login-btn" id="submitBtn">
        Sign In as Employee
      </button>

      <p class="message" id="message"></p>

    </form>

    <div class="support">
      Need help? <a href="#">Contact support</a>
    </div>

  </section>

  <section class="visual-panel">
    <div class="illustration-card">
      <div class="visual-caption">
        <span></span>
        <b id="captionText">Employee Workspace</b>
      </div>

      <img src="team-work-animate.svg" class="crm-svg" id="crmImage" alt="CRM Illustration">
    </div>
  </section>

</div>

<script>
let currentRole = "employee";

function setRole(role, button){
  currentRole = role;

  document.querySelectorAll(".role-btn").forEach(btn => {
    btn.classList.remove("active");
  });

  button.classList.add("active");

  const title = document.getElementById("loginTitle");
  const subtitle = document.getElementById("loginSubtitle");
  const image = document.getElementById("crmImage");
  const caption = document.getElementById("captionText");
  const submitBtn = document.getElementById("submitBtn");
  const message = document.getElementById("message");

  message.textContent = "";

  if(role === "employee"){
    title.textContent = "Employee Login";
    subtitle.textContent = "Login to your calling dashboard and manage customers, leads, follow-ups and daily activity.";
    image.src = "team-work-animate.svg";
    caption.textContent = "Employee Workspace";
    submitBtn.textContent = "Sign In as Employee";
  }else{
    title.textContent = "Admin Login";
    subtitle.textContent = "Login to your admin dashboard and manage CRM users, reports, leads and complete workspace control.";
    image.src = "sync-animate.svg";
    caption.textContent = "Admin Control Panel";
    submitBtn.textContent = "Sign In as Admin";
  }
}

function togglePassword(){
  const password = document.getElementById("password");
  password.type = password.type === "password" ? "text" : "password";
}

function toggleTheme(){
  document.body.classList.toggle("dark");
  localStorage.setItem(
    "nexfund_index_theme",
    document.body.classList.contains("dark") ? "dark" : "light"
  );
}

if(localStorage.getItem("nexfund_index_theme") === "dark"){
  document.body.classList.add("dark");
}

document.getElementById("loginForm").addEventListener("submit", function(e){
  e.preventDefault();

  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;
  const message = document.getElementById("message");

  message.textContent = "";

  if(!username || !password){
    message.textContent = "Please enter username and password.";
    return;
  }

  if(currentRole === "employee"){
    window.location.href = "Index.html";
    return;
  }

  if(currentRole === "admin"){
    window.location.href = "Index.html";
    return;
  }
});
</script>

</body>
</html>
